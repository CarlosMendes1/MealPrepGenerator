name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API ────────────────────────────────────────────────────────────────────
  api:
    name: API — lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # ── Web ────────────────────────────────────────────────────────────────────
  web:
    name: Web — lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit

  # ── Mobile ─────────────────────────────────────────────────────────────────
  mobile:
    name: Mobile — type-check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - name: Expo lint
        run: npm run lint

  # ── EAS Preview build (only on tags) ──────────────────────────────────────
  eas-build:
    name: EAS Preview build
    runs-on: ubuntu-latest
    needs: [api, web, mobile]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps
        working-directory: apps/mobile
        run: npm ci

      - name: EAS Build (preview)
        working-directory: apps/mobile
        run: eas build --platform all --profile preview --non-interactive
