version: '3.9'

services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - apps/api/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Uncomment to run the Next.js web app in Docker too
